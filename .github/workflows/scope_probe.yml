name: Scope Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bypass-sheets-timeout-8nw21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: echo '${{ secrets.TOKENS_JSON }}' > tokens.json
      - run: python scope_probe.py
