name: Spark Ads Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/bypass-sheets-timeout-8nw21
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Write secret files
        run: echo '${{ secrets.ADS_TOKENS_JSON }}' > ads_tokens.json
      - name: Run diag
        run: python spark_diag.py
