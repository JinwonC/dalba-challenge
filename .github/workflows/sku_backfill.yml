name: SKU Backfill

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'SKU 적재 날짜 (YYYY-MM-DD)'
        required: true
        default: '2026-08-17'

jobs:
  sku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bypass-sheets-timeout-8nw21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests gspread google-auth
      - run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json
          echo '${{ secrets.TOKENS_JSON }}' > tokens.json
      - run: python TEST/SKU별_성과.py "${{ github.event.inputs.date }}"
