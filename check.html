<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Creator Listing Check · d'Alba</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1C1400;
    --ink-soft: #6B5020;
    --line: rgba(140,104,0,0.20);
    --card: rgba(255,252,240,0.86);
    --red: #B3261E;
    --red-bg: #FDECEA;
    --amber: #9A6400;
    --amber-bg: #FFF3D6;
    --green: #1E6B3C;
    --green-bg: #E8F5EC;
    --blue: #1F4E79;
    --blue-bg: #E8F0F8;
    --purple: #5A2C7C;
    --purple-bg: #F1E9F7;
    --orange: #9E4A10;
    --orange-bg: #FDEDE0;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #F4D991 0%, #FDF6E0 26%, #FFFBF0 55%, #F9E8A8 100%);
    background-attachment: fixed;
    padding-bottom: 60px;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 0 18px; flex-wrap: wrap;
  }
  .brand { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; }
  .brand small {
    display: block; font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin-top: 3px;
  }

  .langs { display: flex; gap: 4px; }
  .langs button {
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 6px 11px; border: 1px solid var(--line); background: transparent;
    color: var(--ink-soft); border-radius: 2px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #F4D991; border-color: var(--ink); }

  .me {
    font: inherit; font-size: 12px; font-weight: 500; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 2px; background: #FFFDF6; color: var(--ink);
    max-width: 200px;
  }

  .v-self    { background: #F0F0EC;          border-color: rgba(0,0,0,0.14);     color: #4A4638; }
  .s-self    { color: #4A4638; }
  .structure {
    margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
    padding: 7px 11px; border-radius: 2px; background: rgba(255,255,255,0.6);
    display: inline-block; color: var(--ink);
  }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 22px; backdrop-filter: blur(10px); margin-bottom: 16px;
  }

  label.field { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }

  input[type="text"], input[type="password"], textarea {
    width: 100%; font: inherit; font-size: 16px; padding: 13px 15px;
    border: 1px solid var(--line); border-radius: 2px; background: #FFFDF6; color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid rgba(140,104,0,0.35); outline-offset: -1px; }
  textarea { min-height: 130px; resize: vertical; font-size: 14px; line-height: 1.6; }

  button.primary {
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
    padding: 12px 22px; border: none; border-radius: 2px;
    background: var(--ink); color: #F4D991; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    font: inherit; font-size: 12px; font-weight: 500; padding: 9px 15px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    border-radius: 2px; cursor: pointer;
  }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
  .err { font-size: 13px; color: var(--red); margin-top: 10px; }

  /* verdict */
  .verdict { border-radius: 3px; padding: 18px 20px; border: 1px solid; margin-top: 16px; }
  .verdict h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
  .verdict p.sub { font-size: 13px; line-height: 1.65; }
  .v-partner { background: var(--purple-bg); border-color: rgba(90,44,124,0.3); color: var(--purple); }
  .v-casting { background: var(--orange-bg); border-color: rgba(158,74,16,0.3); color: var(--orange); }
  .v-listed  { background: var(--red-bg);   border-color: rgba(179,38,30,0.3);  color: var(--red); }
  .v-inhouse { background: var(--blue-bg);  border-color: rgba(31,78,121,0.3);  color: var(--blue); }
  .v-similar { background: var(--amber-bg); border-color: rgba(154,100,0,0.35); color: var(--amber); }
  .v-new     { background: var(--green-bg); border-color: rgba(30,107,60,0.3);  color: var(--green); }

  .hits { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .hit {
    background: rgba(255,255,255,0.75); border: 1px solid rgba(0,0,0,0.07);
    border-radius: 2px; padding: 10px 13px; color: var(--ink); font-size: 13px; line-height: 1.6;
  }
  .hit .who { font-weight: 600; }
  .hit .meta { color: var(--ink-soft); font-size: 12px; }
  .hit .note { margin-top: 3px; font-size: 12px; color: var(--amber); }

  .tag {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: 2px; margin-left: 6px; vertical-align: 1px;
  }
  .tag-o { background: #DCEEE2; color: #1E6B3C; }
  .tag-x { background: #EFE4E3; color: #8C3A34; }
  .tag-c { background: #E3E9F2; color: #1F4E79; }

  /* bulk table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  td.status { font-weight: 600; white-space: nowrap; }
  .s-listed { color: var(--red); } .s-inhouse { color: var(--blue); }
  .s-partner { color: var(--purple); } .s-casting { color: var(--orange); }
  .s-similar { color: var(--amber); } .s-new { color: var(--green); }
  .table-scroll { overflow-x: auto; }

  .summary { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }
  .summary b { font-size: 20px; display: block; font-weight: 700; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px;
    border: 1px solid var(--line); border-bottom: none; background: transparent;
    color: var(--ink-soft); cursor: pointer; border-radius: 3px 3px 0 0;
  }
  .tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); }

  footer { font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 26px; line-height: 1.8; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">Creator Listing Check<small>d'Alba · TikTok Shop Sourcing</small></div>
    <select id="me" class="me hidden"></select>
    <div class="langs" id="langs">
      <button data-lang="ko" aria-pressed="true">한국어</button>
      <button data-lang="en" aria-pressed="false">English</button>
      <button data-lang="vi" aria-pressed="false">Tiếng Việt</button>
    </div>
  </header>

  <section id="lock" class="panel">
    <label class="field" for="pass" data-i18n="passLabel">팀 패스코드</label>
    <div class="row">
      <input type="password" id="pass" style="flex:1 1 240px" autocomplete="current-password">
      <button class="primary" id="unlock" data-i18n="unlock">열기</button>
    </div>
    <p class="hint" style="margin-top:12px" data-i18n="passHint"></p>
    <p class="err hidden" id="lockErr"></p>
  </section>

  <!-- 본 화면 -->
  <main id="app" class="hidden">
    <div class="tabs">
      <button data-mode="single" aria-pressed="true" data-i18n="modeSingle">한 명 검색</button>
      <button data-mode="bulk" aria-pressed="false" data-i18n="modeBulk">여러 명 한번에</button>
    </div>

    <section id="singlePanel" class="panel">
      <label class="field" for="q" data-i18n="searchLabel">핸들 또는 틱톡 링크</label>
      <input type="text" id="q" placeholder="@handle · https://www.tiktok.com/@handle" autocomplete="off" spellcheck="false">
      <div id="verdict"></div>
    </section>

    <section id="bulkPanel" class="panel hidden">
      <label class="field" for="bulk" data-i18n="bulkLabel">핸들 목록 (한 줄에 하나)</label>
      <textarea id="bulk" spellcheck="false" placeholder="handle1&#10;handle2&#10;https://www.tiktok.com/@handle3"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="runBulk" data-i18n="runBulk">확인</button>
        <button class="ghost" id="copyNew" data-i18n="copyNew">신규만 복사</button>
      </div>
      <div id="bulkOut"></div>
    </section>

    <footer>
      <span id="freshness"></span><br>
      <span data-i18n="footerNote"></span>
    </footer>
  </main>

</div>

/* ---------------- handle 정규화 (빌더의 규칙과 동일해야 한다) ---------------- */
function normalizeHandle(raw) {
  let s = (raw || "").trim();
  if (!s) return "";
  const m = s.match(/(?:tiktok\.com|instagram\.com)\/+@?([^/?#\s]+)/i);
  if (m) s = m[1];
  s = s.split("?")[0].split("#")[0];
  s = s.trim().replace(/^@+/, "").replace(/\/+$/, "").toLowerCase();
  return s.replace(/[^a-z0-9._]/g, "");
}
const squash = (h) => h.replace(/[._]/g, "");

/* crypto.subtle 폴백 — 커스텀 도메인이 HTTP로 리다이렉트되면 브라우저가
   WebCrypto를 막는다. 그 경우에만 쓰는 순수 JS PBKDF2 + AES-256-GCM 복호화.
   결과는 WebCrypto와 비트 단위로 같아야 한다 (tools/verify와 교차 검증됨). */

  const K = new Uint32Array([

    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ]);
  const INIT = new Uint32Array([
    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
  ]);
  const W = new Uint32Array(64);

  function compress(state, block, off) {
    for (let i = 0; i < 16; i++) {
      W[i] = (block[off + i * 4] << 24) | (block[off + i * 4 + 1] << 16) |
             (block[off + i * 4 + 2] << 8) | block[off + i * 4 + 3];
    }
    for (let i = 16; i < 64; i++) {
      const a = W[i - 15], b = W[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = state[0], b = state[1], c = state[2], d = state[3];
    let e = state[4], f = state[5], g = state[6], h = state[7];
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    state[0] = (state[0] + a) | 0; state[1] = (state[1] + b) | 0;
    state[2] = (state[2] + c) | 0; state[3] = (state[3] + d) | 0;
    state[4] = (state[4] + e) | 0; state[5] = (state[5] + f) | 0;
    state[6] = (state[6] + g) | 0; state[7] = (state[7] + h) | 0;
  }

  function sha256(bytes) {
    const state = INIT.slice();
    const len = bytes.length;
    const full = len - (len % 64);
    for (let off = 0; off < full; off += 64) compress(state, bytes, off);
    const rest = len - full;
    const pad = new Uint8Array(rest + 9 <= 64 ? 64 : 128);
    pad.set(bytes.subarray(full));
    pad[rest] = 0x80;
    const bits = len * 8;
    const dv = new DataView(pad.buffer);
    dv.setUint32(pad.length - 8, Math.floor(bits / 0x100000000));
    dv.setUint32(pad.length - 4, bits >>> 0);
    for (let off = 0; off < pad.length; off += 64) compress(state, pad, off);
    const out = new Uint8Array(32);
    for (let i = 0; i < 8; i++) {
      out[i * 4] = state[i] >>> 24; out[i * 4 + 1] = (state[i] >>> 16) & 0xff;
      out[i * 4 + 2] = (state[i] >>> 8) & 0xff; out[i * 4 + 3] = state[i] & 0xff;
    }
    return out;
  }

  /* PBKDF2-HMAC-SHA256, dkLen 32 (한 블록). ipad/opad를 한 번만 흡수해 두고
     이터레이션마다 압축 2회로 줄인다 — 이게 없으면 모바일에서 수십 초 걸린다. */
  function pbkdf2(password, salt, iterations) {
    let key = password;
    if (key.length > 64) key = sha256(key);
    const ipadState = INIT.slice(), opadState = INIT.slice();
    const pad = new Uint8Array(64);
    for (let i = 0; i < 64; i++) pad[i] = (key[i] || 0) ^ 0x36;
    compress(ipadState, pad, 0);
    for (let i = 0; i < 64; i++) pad[i] = (key[i] || 0) ^ 0x5c;
    compress(opadState, pad, 0);

    // U1 = HMAC(P, salt || 0x00000001)
    const msg = new Uint8Array(salt.length + 4);
    msg.set(salt); msg[salt.length + 3] = 1;
    let u = hmacFromMid(ipadState, opadState, msg);
    const dk = u.slice();
    // 이후 U는 항상 32바이트 → 패딩 포함 정확히 한 블록
    const block = new Uint8Array(64);
    block[32] = 0x80; block[62] = 0x03; block[63] = 0x00; // (64+32)*8 = 768 = 0x300
    const st = new Uint32Array(8);
    for (let iter = 1; iter < iterations; iter++) {
      block.set(u);
      st.set(ipadState); compress(st, block, 0); wordsToBytes(st, u);
      block.set(u);
      st.set(opadState); compress(st, block, 0); wordsToBytes(st, u);
      for (let i = 0; i < 32; i++) dk[i] ^= u[i];
    }
    return dk;
  }

  function wordsToBytes(words, out) {
    for (let i = 0; i < 8; i++) {
      out[i * 4] = words[i] >>> 24; out[i * 4 + 1] = (words[i] >>> 16) & 0xff;
      out[i * 4 + 2] = (words[i] >>> 8) & 0xff; out[i * 4 + 3] = words[i] & 0xff;
    }
  }

  function hmacFromMid(ipadState, opadState, msg) {
    const inner = ipadState.slice();
    const withPad = padTail(msg, 64);
    for (let off = 0; off < withPad.length; off += 64) compress(inner, withPad, off);
    const innerHash = new Uint8Array(32);
    wordsToBytes(inner, innerHash);
    const outer = opadState.slice();
    const outerMsg = padTail(innerHash, 64);
    for (let off = 0; off < outerMsg.length; off += 64) compress(outer, outerMsg, off);
    const out = new Uint8Array(32);
    wordsToBytes(outer, out);
    return out;
  }

  /* prefixLen 바이트가 이미 흡수된 상태에서 msg를 SHA-256 패딩까지 붙여 반환 */
  function padTail(msg, prefixLen) {
    const total = prefixLen + msg.length;
    const rem = msg.length % 64;
    const padded = new Uint8Array(msg.length - rem + (rem + 9 <= 64 ? 64 : 128));
    padded.set(msg);
    padded[msg.length] = 0x80;
    const bits = total * 8;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, Math.floor(bits / 0x100000000));
    dv.setUint32(padded.length - 4, bits >>> 0);
    return padded;
  }

  /* ---- AES-256 (암호화 방향만 — CTR/GCM은 이걸로 충분) ---- */
  const SBOX = new Uint8Array(256);
  (() => {
    let p = 1, q = 1;
    do {
      p = p ^ (p << 1) ^ (p & 0x80 ? 0x1b : 0);
      p &= 0xff;
      q ^= q << 1; q ^= q << 2; q ^= q << 4; q &= 0xff;
      if (q & 0x80) q ^= 0x09;
      const rot = (v, n) => ((v << n) | (v >>> (8 - n))) & 0xff;
      SBOX[p] = (q ^ rot(q, 1) ^ rot(q, 2) ^ rot(q, 3) ^ rot(q, 4) ^ 0x63) & 0xff;
    } while (p !== 1);
    SBOX[0] = 0x63;
  })();

  function expandKey(key) {
    const w = new Uint32Array(60);
    for (let i = 0; i < 8; i++) {
      w[i] = (key[i * 4] << 24) | (key[i * 4 + 1] << 16) | (key[i * 4 + 2] << 8) | key[i * 4 + 3];
    }
    let rcon = 1;
    for (let i = 8; i < 60; i++) {
      let t = w[i - 1];
      if (i % 8 === 0) {
        t = (t << 8) | (t >>> 24);
        t = (SBOX[(t >>> 24) & 0xff] << 24) | (SBOX[(t >>> 16) & 0xff] << 16) |
            (SBOX[(t >>> 8) & 0xff] << 8) | SBOX[t & 0xff];
        t ^= rcon << 24;
        rcon = (rcon << 1) ^ (rcon & 0x80 ? 0x11b : 0);
        rcon &= 0xff;
      } else if (i % 8 === 4) {
        t = (SBOX[(t >>> 24) & 0xff] << 24) | (SBOX[(t >>> 16) & 0xff] << 16) |
            (SBOX[(t >>> 8) & 0xff] << 8) | SBOX[t & 0xff];
      }
      w[i] = w[i - 8] ^ t;
    }
    return w;
  }

  const xtime = (x) => ((x << 1) ^ (x & 0x80 ? 0x1b : 0)) & 0xff;

  function encryptBlock(w, inp, out) {
    const s = new Uint8Array(16);
    for (let i = 0; i < 4; i++) {
      s[i * 4] = inp[i * 4] ^ (w[i] >>> 24);
      s[i * 4 + 1] = inp[i * 4 + 1] ^ ((w[i] >>> 16) & 0xff);
      s[i * 4 + 2] = inp[i * 4 + 2] ^ ((w[i] >>> 8) & 0xff);
      s[i * 4 + 3] = inp[i * 4 + 3] ^ (w[i] & 0xff);
    }
    const t = new Uint8Array(16);
    for (let round = 1; round <= 14; round++) {
      // SubBytes + ShiftRows
      for (let c = 0; c < 4; c++) {
        t[c * 4] = SBOX[s[c * 4]];
        t[c * 4 + 1] = SBOX[s[((c + 1) % 4) * 4 + 1]];
        t[c * 4 + 2] = SBOX[s[((c + 2) % 4) * 4 + 2]];
        t[c * 4 + 3] = SBOX[s[((c + 3) % 4) * 4 + 3]];
      }
      if (round < 14) {
        for (let c = 0; c < 4; c++) {
          const a0 = t[c * 4], a1 = t[c * 4 + 1], a2 = t[c * 4 + 2], a3 = t[c * 4 + 3];
          s[c * 4] = xtime(a0) ^ (xtime(a1) ^ a1) ^ a2 ^ a3;
          s[c * 4 + 1] = a0 ^ xtime(a1) ^ (xtime(a2) ^ a2) ^ a3;
          s[c * 4 + 2] = a0 ^ a1 ^ xtime(a2) ^ (xtime(a3) ^ a3);
          s[c * 4 + 3] = (xtime(a0) ^ a0) ^ a1 ^ a2 ^ xtime(a3);
        }
      } else {
        s.set(t);
      }
      const base = round * 4;
      for (let c = 0; c < 4; c++) {
        s[c * 4] ^= w[base + c] >>> 24;
        s[c * 4 + 1] ^= (w[base + c] >>> 16) & 0xff;
        s[c * 4 + 2] ^= (w[base + c] >>> 8) & 0xff;
        s[c * 4 + 3] ^= w[base + c] & 0xff;
      }
    }
    out.set(s);
  }

  /* ---- GF(2^128) 곱 (GHASH) ---- */
  function gmul(x, y) {
    // x, y: Uint32Array(4) big-endian limbs. 반환 z = x·y
    const z = new Uint32Array(4);
    const v = y.slice();
    for (let i = 0; i < 128; i++) {
      if ((x[i >> 5] >>> (31 - (i & 31))) & 1) {
        z[0] ^= v[0]; z[1] ^= v[1]; z[2] ^= v[2]; z[3] ^= v[3];
      }
      const lsb = v[3] & 1;
      v[3] = (v[3] >>> 1) | ((v[2] & 1) << 31);
      v[2] = (v[2] >>> 1) | ((v[1] & 1) << 31);
      v[1] = (v[1] >>> 1) | ((v[0] & 1) << 31);
      v[0] = v[0] >>> 1;
      if (lsb) v[0] ^= 0xe1000000;
    }
    return z;
  }

  function bytesToLimbs(b, off) {
    return new Uint32Array([
      (b[off] << 24 | b[off + 1] << 16 | b[off + 2] << 8 | b[off + 3]) >>> 0,
      (b[off + 4] << 24 | b[off + 5] << 16 | b[off + 6] << 8 | b[off + 7]) >>> 0,
      (b[off + 8] << 24 | b[off + 9] << 16 | b[off + 10] << 8 | b[off + 11]) >>> 0,
      (b[off + 12] << 24 | b[off + 13] << 16 | b[off + 14] << 8 | b[off + 15]) >>> 0,
    ]);
  }

  function ghash(h, data, lenBlock) {
    let y = new Uint32Array(4);
    const block = new Uint8Array(16);
    for (let off = 0; off < data.length; off += 16) {
      block.fill(0);
      block.set(data.subarray(off, Math.min(off + 16, data.length)));
      const c = bytesToLimbs(block, 0);
      y[0] ^= c[0]; y[1] ^= c[1]; y[2] ^= c[2]; y[3] ^= c[3];
      y = gmul(y, h);
    }
    y[0] ^= lenBlock[0]; y[1] ^= lenBlock[1]; y[2] ^= lenBlock[2]; y[3] ^= lenBlock[3];
    return gmul(y, h);
  }

  /* WebCrypto AES-GCM(iv 12바이트, AAD 없음)과 동일: ct 끝 16바이트가 태그 */
  function aesGcmDecrypt(key, iv, ctWithTag) {
    if (ctWithTag.length < 16) throw new Error("bad ct");
    const ct = ctWithTag.subarray(0, ctWithTag.length - 16);
    const tag = ctWithTag.subarray(ctWithTag.length - 16);
    const w = expandKey(key);

    const zero = new Uint8Array(16), hBytes = new Uint8Array(16);
    encryptBlock(w, zero, hBytes);
    const h = bytesToLimbs(hBytes, 0);

    const j0 = new Uint8Array(16);
    j0.set(iv); j0[15] = 1;

    // 태그 검증 먼저: GHASH(C) → E(K, J0) XOR
    const lenBlock = new Uint32Array(4);
    lenBlock[2] = Math.floor((ct.length * 8) / 0x100000000);
    lenBlock[3] = (ct.length * 8) >>> 0;
    const s = ghash(h, ct, lenBlock);
    const ekj0 = new Uint8Array(16);
    encryptBlock(w, j0, ekj0);
    let diff = 0;
    for (let i = 0; i < 4; i++) {
      const word = (ekj0[i * 4] << 24 | ekj0[i * 4 + 1] << 16 | ekj0[i * 4 + 2] << 8 | ekj0[i * 4 + 3]) >>> 0;
      const tagWord = (tag[i * 4] << 24 | tag[i * 4 + 1] << 16 | tag[i * 4 + 2] << 8 | tag[i * 4 + 3]) >>> 0;
      diff |= (s[i] ^ word ^ tagWord);
    }
    if (diff !== 0) throw new Error("auth");

    // CTR 복호화 (J0+1부터)
    const out = new Uint8Array(ct.length);
    const ctr = j0.slice();
    const ks = new Uint8Array(16);
    for (let off = 0; off < ct.length; off += 16) {
      for (let i = 15; i >= 12; i--) {
        ctr[i] = (ctr[i] + 1) & 0xff;
        if (ctr[i] !== 0) break;
      }
      encryptBlock(w, ctr, ks);
      const n = Math.min(16, ct.length - off);
      for (let i = 0; i < n; i++) out[off + i] = ct[off + i] ^ ks[i];
    }
    return out;
  }

  function decrypt(passcodeBytes, salt, iterations, iv, ctWithTag) {
    const key = pbkdf2(passcodeBytes, salt, iterations);
    return aesGcmDecrypt(key, iv, ctWithTag);
  }

  return { decrypt };
})();

/* ---------------- 복호화 ---------------- */
async function decryptIndex(passcode) {
  const res = await fetch("data/listings.enc.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("fetch");
  const env = await res.json();

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let packed;
  if (crypto.subtle) {
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(env.kdf.salt), iterations: env.kdf.iterations, hash: env.kdf.hash },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    // 패스코드가 틀리면 GCM 인증 태그 검증에서 예외가 난다.
    packed = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct)
    );
  } else {
    // HTTP로 열리면 브라우저가 WebCrypto를 비활성화한다 (계정 커스텀 도메인이
    // https 없이 리다이렉트하는 경우). 위와 결과가 동일한 순수 JS 경로.
    packed = SC.decrypt(
      new TextEncoder().encode(passcode),
      b64(env.kdf.salt), env.kdf.iterations, b64(env.iv), b64(env.ct)
    );
  }

  let bytes = new Uint8Array(packed);
  if (env.compression === "gzip") {
    const ds = new DecompressionStream("gzip");
    bytes = new Uint8Array(
      await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer()
    );
  }
  return { payload: JSON.parse(new TextDecoder().decode(bytes)), meta: env };
}

/* ---------------- 인덱스 ---------------- */
const DB = { tabs: [], byHandle: new Map(), bySquash: new Map(), byLen: new Map(),
             owners: [], meta: null };
let me = localStorage.getItem("dalba.me") || "";

function buildIndex(payload, meta) {
  DB.tabs = payload.tabs;
  DB.meta = meta;
  for (const r of payload.records) {
    if (!DB.byHandle.has(r.h)) DB.byHandle.set(r.h, []);
    DB.byHandle.get(r.h).push(r);

    const sq = squash(r.h);
    if (!DB.bySquash.has(sq)) DB.bySquash.set(sq, new Set());
    DB.bySquash.get(sq).add(r.h);
  }
  // 오타 탐색은 길이 ±2 범위만 비교하면 충분하다.
  for (const h of DB.byHandle.keys()) {
    if (!DB.byLen.has(h.length)) DB.byLen.set(h.length, []);
    DB.byLen.get(h.length).push(h);
  }

  const owners = new Set();
  for (const r of payload.records) {
    if (r.k === "sourcing") {
      const o = ownerOf(r);
      if (o) owners.add(o);
    }
  }
  DB.owners = [...owners].sort((a, b) => a.localeCompare(b));
}

/** 편집거리가 limit 이하인지만 판정하고 넘으면 즉시 포기한다. */
function withinDistance(a, b, limit) {
  if (Math.abs(a.length - b.length) > limit) return false;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > limit) return false;
    prev = cur;
  }
  return prev[b.length] <= limit;
}

function findSimilar(norm) {
  const out = new Set();

  // 1) 점·밑줄만 다른 경우 (glow.by.rosa ↔ glowbyrosa)
  const sq = DB.bySquash.get(squash(norm));
  if (sq) for (const h of sq) if (h !== norm) out.add(h);

  // 2) 한두 글자 오타
  const limit = norm.length >= 12 ? 2 : 1;
  for (let len = norm.length - limit; len <= norm.length + limit; len++) {
    for (const h of DB.byLen.get(len) || []) {
      if (h === norm || out.has(h)) continue;
      if (withinDistance(norm, h, limit)) out.add(h);
      if (out.size >= 8) return [...out];
    }
  }
  return [...out];
}

// 여러 곳에 걸리면 가장 강한 신호를 헤드라인으로 쓴다.
// 유가 협업 > 인하우스 > 제안 발송 > 단순 리스팅 순으로 "접촉하면 안 되는 정도"가 세다.
const KIND_ORDER = ["partner", "inhouse", "casting", "sourcing"];
const KIND_VERDICT = { partner: "partner", inhouse: "inhouse", casting: "casting", sourcing: "listed" };
const kindRank = (r) => {
  const i = KIND_ORDER.indexOf(r.k);
  return i === -1 ? KIND_ORDER.length : i;
};

function judge(input) {
  const norm = normalizeHandle(input);
  if (!norm) return null;

  const hits = (DB.byHandle.get(norm) || []).slice().sort((a, b) => kindRank(a) - kindRank(b));
  if (hits.length) {
    let kind = KIND_VERDICT[hits[0].k] || "listed";
    // 본인만 리스팅한 건 중복이 아니다 — 시트 조건부서식과 같은 규칙.
    if (kind === "listed" && me) {
      const others = hits.filter((r) => ownerOf(r) !== me);
      if (!others.length) kind = "self";
    }
    return { norm, kind, hits, similar: [] };
  }

  const similar = findSimilar(norm);
  if (similar.length) {
    const simHits = similar.flatMap((h) => DB.byHandle.get(h) || []);
    return { norm, kind: "similar", hits: simHits, similar };
  }
  return { norm, kind: "new", hits: [], similar: [] };
}

/* ---------------- 렌더 ---------------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** 누가 잡았는지 — 담당자 컬럼이 있으면 그걸 쓴다.
 *  구 시트의 "(new) ..." 탭은 담당자별로 나뉘어 있어 탭 이름이 곧 담당자다. */
function ownerOf(r) {
  const tab = DB.tabs[r.t];
  if (r.k === "inhouse") return r.m ? `${r.m} (in-house)` : "in-house";
  if (r.m) return r.m;
  // duplicate 탭은 여러 담당자의 행을 모아둔 것이라 탭 이름이 담당자가 아니다.
  // 담당자 칸이 비어 있으면 이름을 지어내지 않는다.
  if (!tab || /^duplicate$/i.test(tab.n)) return "";
  return tabOwner(tab.n);
}

const tabOwner = (name) => name.replace(/^\s*\(\s*new\s*\)\s*[-–·]?\s*/i, "").trim() || name;

function whereOf(r) {
  const tab = DB.tabs[r.t];
  if (!tab) return "";
  // duplicate 탭 레코드는 어느 제품 탭에서 왔는지가 탭 이름보다 중요하다.
  const inner = r.p || (r.m ? tab.n : "");
  return inner && !/^duplicate$/i.test(inner) ? `${tab.s} · ${inner}` : tab.s;
}

function renderHit(r) {
  const who = ownerOf(r) || t("noOwner");
  const bits = [];
  const where = whereOf(r);
  if (where) bits.push(esc(where));
  if (r.l) bits.push(`${t("listedOn")} ${esc(r.l)}`);
  if (r.c) bits.push(`${t("contacted")} ${esc(r.c)}`);
  if (r.s) bits.push(`${t("statusLbl")}: ${esc(r.s)}`);

  let tags = "";
  if (r.o === "O") tags += `<span class="tag tag-o">O</span>`;
  if (r.o === "X") tags += `<span class="tag tag-x">X</span>`;
  if (r.c) tags += `<span class="tag tag-c">DM</span>`;

  return `<div class="hit">
    <div><span class="who">${esc(who)}</span>${tags}</div>
    ${bits.length ? `<div class="meta">${bits.join(" · ")}</div>` : ""}
    ${r.n ? `<div class="note">“${esc(r.n)}”</div>` : ""}
  </div>`;
}

/** 중복이 어떻게 생겼는지 — 담당자 몇 명이 제품 탭 몇 곳에, 언제부터 언제까지. */
function structureOf(hits) {
  const owners = new Set(), tabs = new Set(), dates = [];
  for (const r of hits) {
    const o = ownerOf(r);
    if (o) owners.add(o);
    if (r.p) tabs.add(r.p);
    if (r.l) dates.push(r.l);
  }
  if (owners.size < 2 && tabs.size < 2) return "";
  dates.sort();
  return t("structure")(owners.size, tabs.size, dates[0] || "", dates[dates.length - 1] || "");
}

function renderVerdict(v) {
  const box = document.getElementById("verdict");
  if (!v) { box.innerHTML = ""; return; }

  const titles = { partner: "vPartner", casting: "vCasting", listed: "vListed",
                   inhouse: "vInhouse", self: "vSelf", similar: "vSimilar", new: "vNew" };
  const subs = { partner: "vPartnerSub", casting: "vCastingSub", listed: "vListedSub",
                 inhouse: "vInhouseSub", self: "vSelfSub", similar: "vSimilarSub", new: "vNewSub" };

  let extra = "";
  if (v.kind === "similar") {
    extra = `<div class="hits">${v.similar
      .map((h) => `<div class="hit"><span class="who">@${esc(h)}</span>${
        (DB.byHandle.get(h) || [])
          .map((r) => `<div class="meta">${esc([ownerOf(r), whereOf(r)].filter(Boolean).join(" · "))}</div>`)
          .join("")
      }</div>`).join("")}</div>`;
  } else if (v.hits.length) {
    extra = `<div class="hits">${v.hits.map(renderHit).join("")}</div>`;
  }

  const struct = v.similar.length ? "" : structureOf(v.hits);
  box.innerHTML = `<div class="verdict v-${v.kind}">
    <h2>${esc(t(titles[v.kind]))}</h2>
    <p class="sub">@${esc(v.norm)} — ${esc(t(subs[v.kind]))}</p>
    ${struct ? `<div class="structure">${esc(struct)}</div>` : ""}
    ${extra}
  </div>`;
}

function renderBulk(results) {
  const out = document.getElementById("bulkOut");
  const labels = { partner: "sPartner", casting: "sCasting", listed: "sListed",
                   inhouse: "sInhouse", self: "sSelf", similar: "sSimilar", new: "sNew" };

  const countOf = (...kinds) => results.filter((r) => kinds.includes(r.v.kind)).length;
  const nNew = countOf("new", "self");
  const nDup = countOf("listed");
  const nPartner = countOf("partner", "inhouse", "casting");
  const nOther = countOf("similar");

  const rows = results.map(({ raw, v }) => {
    let detail = "";
    if (v.kind === "similar") {
      detail = v.similar.map((h) => "@" + h).join(", ");
    } else if (v.hits.length) {
      detail = v.hits
        .map((r) => (ownerOf(r) || t("noOwner")) + (r.p ? ` · ${r.p}` : "") + (r.l ? ` · ${r.l}` : ""))
        .join(" / ");
    }
    return `<tr>
      <td><code>${esc(v.norm || raw)}</code></td>
      <td class="status s-${v.kind}">${esc(t(labels[v.kind]))}</td>
      <td>${esc(detail)}</td>
    </tr>`;
  }).join("");

  out.innerHTML = `
    <div class="summary">
      <div><b class="s-new">${nNew}</b>${esc(t("sumNew"))}</div>
      <div><b class="s-listed">${nDup}</b>${esc(t("sumDup"))}</div>
      <div><b class="s-partner">${nPartner}</b>${esc(t("sumPartner"))}</div>
      <div><b class="s-similar">${nOther}</b>${esc(t("sumOther"))}</div>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th>${esc(t("colHandle"))}</th><th>${esc(t("colResult"))}</th><th>${esc(t("colDetail"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ---------------- 화면 배선 ---------------- */
let lastBulk = [];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (I18N[lang][k] && typeof I18N[lang][k] === "string") el.textContent = I18N[lang][k];
  });
  document.querySelectorAll("#langs button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const sel = document.getElementById("me");
  if (DB.owners.length) {
    sel.innerHTML = `<option value="">${esc(t("mePick"))}</option>` +
      DB.owners.map((o) => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
    sel.value = DB.owners.includes(me) ? me : "";
    sel.classList.remove("hidden");
  }
  if (DB.meta) {
    const d = new Date(DB.meta.generated_at);
    const stamp = isNaN(d) ? DB.meta.generated_at : d.toLocaleString(lang === "ko" ? "ko-KR" : lang === "vi" ? "vi-VN" : "en-US");
    document.getElementById("freshness").textContent = I18N[lang].fresh(stamp, DB.meta.records);
  }
  const q = document.getElementById("q");
  if (q && q.value.trim()) renderVerdict(judge(q.value));
  if (lastBulk.length) renderBulk(lastBulk);
}

document.getElementById("me").addEventListener("change", (e) => {
  me = e.target.value;
  localStorage.setItem("dalba.me", me);
  const q = document.getElementById("q");
  if (q.value.trim()) renderVerdict(judge(q.value));
  if (lastBulk.length) {
    lastBulk = lastBulk.map(({ raw }) => ({ raw, v: judge(raw) })).filter((r) => r.v);
    renderBulk(lastBulk);
  }
});

document.getElementById("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  lang = b.dataset.lang;
  localStorage.setItem("dalba.lang", lang);
  applyLang();
});

async function unlock(passcode, fromStorage) {
  const err = document.getElementById("lockErr");
  const btn = document.getElementById("unlock");
  err.classList.add("hidden");
  btn.disabled = true;
  try {
    const { payload, meta } = await decryptIndex(passcode);
    buildIndex(payload, meta);
    localStorage.setItem("dalba.pass", passcode);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    applyLang();
    document.getElementById("q").focus();
  } catch (e) {
    if (!fromStorage) {
      err.textContent = e && e.message === "fetch" ? t("loadFail") : t("passWrong");
      err.classList.remove("hidden");
    }
    localStorage.removeItem("dalba.pass");
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("unlock").addEventListener("click", () =>
  unlock(document.getElementById("pass").value.trim(), false));
document.getElementById("pass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("unlock").click();
});

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const single = b.dataset.mode === "single";
  document.querySelectorAll(".tabs button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x === b)));
  document.getElementById("singlePanel").classList.toggle("hidden", !single);
  document.getElementById("bulkPanel").classList.toggle("hidden", single);
});

let debounce;
document.getElementById("q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  const val = e.target.value;
  debounce = setTimeout(() => renderVerdict(val.trim() ? judge(val) : null), 120);
});

document.getElementById("runBulk").addEventListener("click", () => {
  const lines = document.getElementById("bulk").value
    .split(/[\n,;\t]+/).map((s) => s.trim()).filter(Boolean);
  if (!lines.length) { alert(t("emptyBulk")); return; }
  const seen = new Set();
  lastBulk = [];
  for (const raw of lines) {
    const v = judge(raw);
    if (!v || seen.has(v.norm)) continue;
    seen.add(v.norm);
    lastBulk.push({ raw, v });
  }
  renderBulk(lastBulk);
});

document.getElementById("copyNew").addEventListener("click", async () => {
  const fresh = lastBulk.filter((r) => r.v.kind === "new").map((r) => r.v.norm);
  await navigator.clipboard.writeText(fresh.join("\n"));
  const b = document.getElementById("copyNew");
  const old = b.textContent;
  b.textContent = t("copied");
  setTimeout(() => { b.textContent = old; }, 1400);
});

applyLang();
const saved = localStorage.getItem("dalba.pass");
if (saved) unlock(saved, true);
</script>
